[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insider-trades"
version = "1.0.0"
description = "NASDAQ & S&P 500 Insider Trades Tracker & Quantitative Strategy Backtester organized by GICS Industry"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "lxml>=4.9.0",
    "tabulate>=0.9.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
