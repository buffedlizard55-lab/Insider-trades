name: Daily Insider Trades & Heatmap Update

on:
  schedule:
    # Run at 22:00 UTC Monday through Friday (after US market close)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    # Allow manual execution from GitHub Actions UI

jobs:
  update-insider-trades:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Form 4 Insider Trades Dataset
        run: |
          python main.py update --all
          python main.py heatmap --days 90 --format markdown > DAILY_HEATMAP_REPORT.md

      - name: Check for changes and commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ DAILY_HEATMAP_REPORT.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(data): daily SEC Form 4 insider trades update & heatmap [skip ci]"
            git push
          else
            echo "No new Form 4 trades or summary changes to commit."
          fi
